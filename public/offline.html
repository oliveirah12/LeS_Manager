<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#a52d40" />
  <title>LeS Manager · Sem conexão</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('les-manager.theme') || ''; } catch {}
  </script>
  <style>
    body { font: 1rem/1.6 system-ui, sans-serif; color: #34232a; background: #f9f5f5; padding: 2rem 1rem; }
    main { max-width: 30rem; margin: auto; background: white; border-radius: .8rem; padding: 1.4rem; }
    a { color: #a52d40; font-weight: bold; }
    html[data-theme="dark"] body { color: #f7edf0; background: #20171b; }
    html[data-theme="dark"] main { background: #2e2228; }
    html[data-theme="dark"] a { color: #f5aab6; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) body { color: #f7edf0; background: #20171b; }
      html:not([data-theme="light"]) main { background: #2e2228; }
      html:not([data-theme="light"]) a { color: #f5aab6; }
    }
  </style>
</head>
<body>
  <main><h1>Sem conexão</h1><p>Conecte-se à internet ou à rede da empresa para acessar o LeS Manager.</p><a href="/">Tentar novamente</a></main>
</body>
</html>
